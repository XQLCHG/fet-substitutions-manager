name: Invigilation CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/china-invigilation-app
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/invigilation-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      ENVIRONMENT: development
      SECRET_KEY: invigilation-ci-only-secret-key-2026-not-for-production
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run invigilation tests
        run: >-
          python -m pytest -q
          tests/test_invigilation_phase2.py
          tests/test_invigilation_solver.py
          tests/test_invigilation_export.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
